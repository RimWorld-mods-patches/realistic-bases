# Build, test and package the mod. Called by pr-check.yml, release-main.yml
# and release.yml so that every channel runs the same checks.

name: Build

on:
  workflow_call:
    inputs:
      channel:
        description: "'pr' (unstamped), 'main' (rolling stamp) or 'release' (tag must match the version)"
        type: string
        required: true
    outputs:
      artifact:
        description: Name of the uploaded zip artifact
        value: ${{ jobs.package.outputs.artifact }}
      zip:
        description: File name of the mod zip inside that artifact
        value: ${{ jobs.package.outputs.zip }}
      mod_version:
        description: modVersion written into the packaged About.xml
        value: ${{ jobs.package.outputs.mod_version }}

env:
  SLN_PATH: RealisticBases.sln
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # The test runners target net8.0; let them run on a newer runtime on the
  # SDK override legs, where only that runtime is guaranteed.
  DOTNET_ROLL_FORWARD: Major

permissions:
  contents: read

jobs:
  build-test:
    name: Build, Test (${{ matrix.os }}, .NET ${{ matrix.sdk }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # '11' is preview-only right now, so let it fail without blocking - this
    # leg exists to catch upcoming breaks early, not to gate on preview-SDK
    # bugs unrelated to this repo's code.
    continue-on-error: ${{ matrix.sdk == '11' }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Add another major version (e.g. '12', '9') to test more SDKs.
        sdk: [global.json, '10', '11']
      fail-fast: false
    defaults:
      run:
        shell: bash
    steps:

    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # The committed global.json pins a specific major version, which would
    # otherwise force every "dotnet" invocation on this leg (including
    # setup-dotnet's own internal calls) back to that version regardless of
    # which SDK we install below.
    - name: Remove committed global.json for SDK override leg
      if: matrix.sdk != 'global.json'
      run: rm global.json

    - name: Set up .NET (pinned)
      if: matrix.sdk == 'global.json'
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json
        cache: true
        cache-dependency-path: '**/*.csproj'

    - name: Set up .NET (override)
      if: matrix.sdk != 'global.json'
      id: setup_dotnet_override
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: ${{ matrix.sdk }}.0.x
        cache: true
        cache-dependency-path: '**/*.csproj'

    # A generic "major.0.100" anchor + rollForward doesn't reliably match a
    # preview-only install (dotnet/sdk#12335) - pin the exact resolved
    # version instead, per https://github.com/actions/setup-dotnet#matrix-testing.
    - name: Pin global.json to resolved override SDK
      if: matrix.sdk != 'global.json'
      run: echo '{"sdk":{"version":"${{ steps.setup_dotnet_override.outputs.dotnet-version }}","rollForward":"latestPatch"}}' > ./global.json

    - name: Display SDK version
      run: dotnet --version

    # Catches a silent wrong-SDK regression: dotnet --version could report
    # the global.json-pinned major instead of this leg's intended one.
    - name: Verify resolved SDK matches this leg's expected major version
      run: |
        ACTUAL_MAJOR=$(dotnet --version | cut -d. -f1)
        if [ "${{ matrix.sdk }}" = "global.json" ]; then
          EXPECTED_MAJOR=$(grep -oE '"version": *"[0-9]+' global.json | grep -oE '[0-9]+$')
        else
          EXPECTED_MAJOR="${{ matrix.sdk }}"
        fi
        echo "Resolved SDK major: $ACTUAL_MAJOR, expected: $EXPECTED_MAJOR"
        if [ "$ACTUAL_MAJOR" != "$EXPECTED_MAJOR" ]; then
          echo "::error::Resolved .NET SDK major ($ACTUAL_MAJOR) does not match this leg's expected major ($EXPECTED_MAJOR)"
          exit 1
        fi

    - name: Restore dependencies
      run: dotnet restore ${{ env.SLN_PATH }}

    - name: Build debug
      run: dotnet build ${{ env.SLN_PATH }} --configuration Debug --no-restore

    - name: Build release
      run: dotnet build ${{ env.SLN_PATH }} --configuration Release --no-restore

    # The test projects are console runners that exit non-zero on failure.
    - name: Run planner and garrison tests
      run: |
        set -o pipefail
        mkdir -p TestResults
        dotnet run --project Source/RealisticBases.PlannerTests/RealisticBases.PlannerTests.csproj \
          --configuration Release --no-build | tee TestResults/planner-tests.log

    # The layout suite takes about 20 minutes on a hosted runner; run it once,
    # on Linux with the pinned SDK.
    - name: Run layout tests
      if: matrix.sdk == 'global.json' && runner.os == 'Linux'
      run: |
        set -o pipefail
        mkdir -p TestResults
        dotnet run --project Source/RealisticBases.LayoutTests/RealisticBases.LayoutTests.csproj \
          --configuration Release --no-build | tee TestResults/layout-tests.log

    # overwrite: true because this name is keyed by matrix values, not run
    # attempt - re-running a leg would otherwise 409-conflict against the
    # first attempt's artifact.
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: test-results-${{ matrix.os }}-${{ matrix.sdk }}
        path: TestResults/
        retention-days: 7
        if-no-files-found: error
        overwrite: true

  format-check:
    name: Code formatting (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:

    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json
        cache: true
        cache-dependency-path: '**/*.csproj'

    - name: Restore dependencies
      run: dotnet restore ${{ env.SLN_PATH }}

    # continue-on-error reports formatting issues in the log without blocking
    # until a formatting baseline is agreed.
    - name: Check code formatting
      continue-on-error: true
      run: dotnet format ${{ env.SLN_PATH }} --verify-no-changes --no-restore

  package:
    name: Package mod
    needs: [build-test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact: ${{ steps.stamp.outputs.artifact }}
      zip: ${{ steps.stamp.outputs.zip }}
      mod_version: ${{ steps.stamp.outputs.mod_version }}
    steps:

    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # About.xml and the project must agree (see the shared version-bump
    # skill); a release tag must name that version.
    - name: Compute version stamp
      id: stamp
      env:
        CHANNEL: ${{ inputs.channel }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        VERSION=$(grep -Po '(?<=<modVersion>)[^<]+' About/About.xml)
        PROJECT_VERSION=$(grep -Po '(?<=<Version>)[^<]+' Source/RealisticBases/RealisticBases.csproj)
        if [ "$VERSION" != "$PROJECT_VERSION" ]; then
          echo "::error::About.xml modVersion ($VERSION) and project Version ($PROJECT_VERSION) disagree"
          exit 1
        fi
        SHORT_SHA=$(git rev-parse --short HEAD)
        case "$CHANNEL" in
          pr)
            MOD_VERSION="$VERSION"
            ARTIFACT="RealisticBases-pr${PR_NUMBER}-${SHORT_SHA}" ;;
          main)
            MOD_VERSION="${VERSION}-main.$(date -u +%Y%m%d)+${SHORT_SHA}"
            ARTIFACT="RealisticBases-${MOD_VERSION}" ;;
          release)
            if [ "$REF_TYPE" != "tag" ] || [ "$REF_NAME" != "v${VERSION}" ]; then
              echo "::error::Release ref '$REF_NAME' must be the tag v${VERSION}"
              exit 1
            fi
            MOD_VERSION="$VERSION"
            ARTIFACT="RealisticBases-${VERSION}" ;;
          *)
            echo "::error::Unknown channel '$CHANNEL'"
            exit 1 ;;
        esac
        {
          echo "version=${VERSION}"
          echo "mod_version=${MOD_VERSION}"
          echo "artifact=${ARTIFACT}"
          echo "zip=${ARTIFACT}.zip"
        } >> "$GITHUB_OUTPUT"
        echo "modVersion: ${MOD_VERSION}"

    - name: Set up .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json
        cache: true
        cache-dependency-path: '**/*.csproj'

    # The mod project writes RealisticBases.dll into 1.6/Assemblies/, which
    # together with About/ and 1.6/Defs/ is the complete mod folder.
    - name: Build mod (Release)
      run: dotnet build Source/RealisticBases/RealisticBases.csproj --configuration Release

    - name: Verify shipped assemblies
      run: |
        set -euo pipefail
        ACTUAL=$(cd 1.6/Assemblies && ls)
        if [ "$ACTUAL" != "RealisticBases.dll" ]; then
          echo "::error::1.6/Assemblies must contain only RealisticBases.dll, found: $ACTUAL"
          exit 1
        fi

    - name: Stamp About.xml
      if: inputs.channel == 'main'
      run: |
        set -euo pipefail
        sed -i "s/<name>\(.*\)<\/name>\$/<name>\1 [Main]<\/name>/" About/About.xml
        sed -i "s/<modVersion>.*<\/modVersion>/<modVersion>${{ steps.stamp.outputs.mod_version }}<\/modVersion>/" About/About.xml
        grep -E '<name>|<modVersion>' About/About.xml

    - name: Package mod files
      run: |
        set -euo pipefail
        mkdir -p artifacts/mod/RealisticBases
        cp -R About 1.6 artifacts/mod/RealisticBases/
        (cd artifacts/mod && zip -r "../${{ steps.stamp.outputs.zip }}" RealisticBases/)
        ls -la "artifacts/${{ steps.stamp.outputs.zip }}"

    # upload-artifact strips exactly the given "path" and keeps everything
    # below it, so pointing at the parent of RealisticBases/ makes it the
    # artifact's root.
    - name: Upload mod artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ steps.stamp.outputs.artifact }}
        path: artifacts/mod/
        retention-days: 7
        if-no-files-found: error

    - name: Upload release zip
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ steps.stamp.outputs.artifact }}-zip
        path: artifacts/${{ steps.stamp.outputs.zip }}
        retention-days: 7
        if-no-files-found: error

# Versioned release from a tag. The tag must be v<modVersion>, e.g. v0.1.0.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    with:
      channel: release

  publish:
    name: Publish release
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:

    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Download mod zip
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ needs.build.outputs.artifact }}-zip

    - name: Publish release
      run: |
        set -euo pipefail
        gh release create "${{ github.ref_name }}" \
          --verify-tag \
          --title "Realistic Bases ${{ needs.build.outputs.mod_version }}" \
          --notes-file ".github/workflows/release-notes.md" \
          --generate-notes \
          --latest=true \
          "${{ needs.build.outputs.zip }}"
